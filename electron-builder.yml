appId: com.saboorhamedbi.kmanager
productName: KManager AI
compression: maximum
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/**'
  - '!test/**'
  - '!test-results/**'
  - '!scripts/**'
  - '!assets/**'
  - '!doc/**'
  - '!brain/**'
  - '!ui/**'
  - '!search/**'
  - '!system/**'
  - '!*.{md,sql,py,db}'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md,guide.md,error.md,suggestions.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!**/locales/*.pak'
  - '!**/swiftshader/**'
  - '!**/node_modules/*/{README.md,readme.md,CHANGELOG.md,changelog.md}'
  - '!**/node_modules/*/{test,tests,__tests__,docs,example,examples}/**'
  - '!**/node_modules/**/*.map'
  - '!**/node_modules/**/*.d.ts'
asarUnpack:
  - resources/**
  - node_modules/onnxruntime-node/**
win:
  executableName: kmanager
  compression: maximum
  files:
    - '!node_modules/onnxruntime-node/bin/napi-v6/darwin/**'
    - '!node_modules/onnxruntime-node/bin/napi-v6/linux/**'
    - '!node_modules/onnxruntime-node/bin/napi-v6/win32/ia32/**'
    - '!node_modules/onnxruntime-node/bin/napi-v6/win32/arm64/**'
  target:
    - target: nsis
      arch:
        - x64
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  files:
    - '!node_modules/onnxruntime-node/bin/napi-v6/win32/**'
    - '!node_modules/onnxruntime-node/bin/napi-v6/linux/**'
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: false
  target:
    - target: dmg
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  files:
    - '!node_modules/onnxruntime-node/bin/napi-v6/win32/**'
    - '!node_modules/onnxruntime-node/bin/napi-v6/darwin/**'
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
  maintainer: electronjs.org
  category: Utility
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
extraResources:
  - from: assets
    to: assets
    filter:
      - "**/*"
  - from: schema.sql
    to: schema.sql
  - from: brain
    to: brain
    filter:
      - "**/*"
  - from: doc
    to: doc
    filter:
      - "**/*"
publish:
  provider: github
  owner: Saboor-Hamedi
  repo: KManager-AI
  releaseType: release
